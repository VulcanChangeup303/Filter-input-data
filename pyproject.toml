[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-input-data"
version = "0.1.0"
description = "My project involves filtering input data from a CSV file and loading it directly into sqlite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "VulcanChangeup303" }]

dependencies = []

[tool.setuptools]
py-modules = ["app"]

[project.scripts]
filter-expenses = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
